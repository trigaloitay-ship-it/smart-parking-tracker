server {
    listen 80;
    server_name _;

    # Dashboard (static HTML)
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # Reverse proxy to the storage service.
    # "storage" is resolved by Docker's internal DNS (service name).
    # Same origin for the browser -> no CORS problems.
    location /storage/ {
        proxy_pass http://storage:80/;
    }
}
