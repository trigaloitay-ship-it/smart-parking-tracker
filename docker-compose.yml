# Smart Parking License Plate Tracker - Track 1 (Lite)
# Two containers (web + storage) and one named volume (plates-data).

services:
  # Dashboard for the parking guard (Nginx)
  web:
    build: ./web                     # build the image from web/Dockerfile
    image: parking-web:latest        # name of the image we build
    container_name: parking-web
    ports:
      - "8080:80"                    # host port 8080 -> port 80 inside the container
    depends_on:
      storage:
        condition: service_healthy   # start only after storage answers HTTP (see healthcheck)
    networks:
      - parking-net                  # same network as storage -> can reach it by the name "storage"
    restart: unless-stopped          # if the container crashes, Docker starts it again

  # Photo storage server for the IoT camera (Apache)
  storage:
    build: ./storage                 # build the image from storage/Dockerfile
    image: parking-storage:latest
    container_name: parking-storage
    ports:
      - "8081:80"                    # optional: open the photo store directly in the browser
    volumes:
      - plates-data:/usr/local/apache2/htdocs/images   # the ONLY place photos come from
    networks:
      - parking-net
    healthcheck:                     # "is Apache really answering?" - checked every 10 seconds
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/images/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  plates-data:                       # named volume managed by Docker - survives "docker compose down"
                                     # (only "docker compose down -v" deletes it)

networks:
  parking-net:
    driver: bridge                   # private network for our two containers
