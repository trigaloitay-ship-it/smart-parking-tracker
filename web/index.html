<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Parking – לוח בקרה לשומר</title>
  <style>
    :root {
      --bg: #0F1B2D;
      --panel: #17263D;
      --card: #1E3150;
      --text: #EAF0F8;
      --muted: #8DA2BF;
      --accent: #F7C600;
      --ok: #3DDC97;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding: 20px 32px;
      background: var(--panel);
    }
    h1 { margin: 0; font-size: 26px; }
    h1 span { color: var(--accent); }
    .live { color: var(--muted); font-size: 14px; }
    .dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      background: var(--ok); margin-left: 6px; animation: pulse 1.5s infinite;
    }
    .dot.err { background: #FF6B6B; animation: none; }
    @keyframes pulse { 50% { opacity: .3; } }

    .stats { display: flex; gap: 16px; padding: 24px 32px 0; flex-wrap: wrap; }
    .stat {
      background: var(--panel); border-radius: 12px; padding: 16px 24px; min-width: 180px;
    }
    .stat b { display: block; font-size: 34px; color: var(--accent); }
    .stat small { color: var(--muted); }

    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      padding: 24px 32px 40px;
    }
    .car {
      background: var(--card); border-radius: 14px; overflow: hidden;
      box-shadow: 0 4px 14px rgba(0,0,0,.25);
    }
    .car.new { outline: 3px solid var(--ok); }
    .car img { width: 100%; display: block; background: #fff; padding: 12px; }
    .car .info { padding: 12px 16px; display: flex; justify-content: space-between; }
    .plate { font-size: 20px; font-weight: bold; direction: ltr; }
    .time { color: var(--muted); font-size: 14px; }
    .empty { color: var(--muted); padding: 40px 32px; }
  </style>
</head>
<body>
  <header>
    <h1>🅿️ Smart Parking <span>License Plate Tracker</span></h1>
    <div class="live"><span id="dot" class="dot"></span><span id="status">מתחבר לשרת האחסון…</span></div>
  </header>

  <section class="stats">
    <div class="stat"><b id="count">0</b><small>רכבים שנכנסו</small></div>
    <div class="stat"><b id="last">—</b><small>כניסה אחרונה</small></div>
  </section>

  <main id="cars"></main>

  <script>
    // Images live in the storage service (Apache).
    // Nginx proxies /storage/ -> http://storage:80/ (see nginx.conf)
    const STORAGE_URL = "/storage/images/";
    const REFRESH_MS = 5000;
    const seen = new Set();

    const IMAGE_RE = /\.(png|jpe?g|webp)$/i;

    // File name from add-car: <PLATE>_<YYYYMMDD-HHMMSS>.<ext>  ->  plate + entry time
    function parseFile(name) {
      const decoded = decodeURIComponent(name);
      const m = decoded.match(/^(.+)_(\d{8})-(\d{6})\.\w+$/);
      if (!m) return { file: name, plate: decoded.replace(IMAGE_RE, ""), date: null };
      const [, plate, d, t] = m;
      const date = new Date(`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}T${t.slice(0,2)}:${t.slice(2,4)}:${t.slice(4,6)}`);
      return { file: name, plate, date };
    }

    async function loadCars() {
      try {
        // Apache returns an HTML directory listing - we parse its links
        const res = await fetch(STORAGE_URL, { cache: "no-store" });
        if (!res.ok) throw new Error(res.status);
        const doc = new DOMParser().parseFromString(await res.text(), "text/html");
        const files = [...doc.querySelectorAll("a")]
          .map(a => a.getAttribute("href"))
          .filter(h => IMAGE_RE.test(h));

        const cars = files.map(parseFile).sort((a, b) => (b.date || 0) - (a.date || 0));
        render(cars);
        setStatus(true, "מחובר · עודכן " + new Date().toLocaleTimeString("he-IL"));
      } catch (e) {
        setStatus(false, "אין חיבור לשרת האחסון");
      }
    }

    function render(cars) {
      const main = document.getElementById("cars");
      document.getElementById("count").textContent = cars.length;
      document.getElementById("last").textContent =
        cars[0] && cars[0].date ? cars[0].date.toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" }) : "—";

      if (!cars.length) {
        main.innerHTML = '<p class="empty">עדיין לא נכנסו רכבים.</p>';
        return;
      }
      const firstLoad = seen.size === 0;
      main.innerHTML = "";
      for (const car of cars) {
        const isNew = !firstLoad && !seen.has(car.file);
        seen.add(car.file);
        const el = document.createElement("article");
        el.className = "car" + (isNew ? " new" : "");
        el.innerHTML = `
          <img>
          <div class="info">
            <span class="plate"></span>
            <span class="time">${car.date ? car.date.toLocaleString("he-IL") : ""}</span>
          </div>`;
        const img = el.querySelector("img");
        img.src = STORAGE_URL + car.file;
        img.alt = "לוחית " + car.plate;
        el.querySelector(".plate").textContent = car.plate;   // textContent = safe from HTML injection
        main.appendChild(el);
      }
    }

    function setStatus(ok, text) {
      document.getElementById("dot").className = "dot" + (ok ? "" : " err");
      document.getElementById("status").textContent = text;
    }

    loadCars();
    setInterval(loadCars, REFRESH_MS);   // live refresh without reloading the page
  </script>
</body>
</html>
