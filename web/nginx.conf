server {
    listen 80;                                  # port inside the container
    server_name _;                              # answer for any host name

    # 1) The dashboard page (static HTML)
    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    # 2) Reverse proxy: /storage/... is passed to the storage container (Apache).
    #    "storage" is the service name - Docker's internal DNS turns it into the container's IP.
    #    The browser talks to one address only -> no CORS problems.
    location /storage/ {
        proxy_pass http://storage:80/;
    }
}
