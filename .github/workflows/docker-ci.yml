name: Docker CI/CD

# Run on every push to any branch, and on every Pull Request
on:
  push:
    branches: ["**"]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  # Job 1: build the images, start the system and check that it really works
  build-and-test:
    runs-on: ubuntu-latest                    # a clean Linux machine from GitHub, Docker already installed
    steps:
      - name: Checkout code
        uses: actions/checkout@v5             # download the repo's code onto the machine

      - name: Validate docker-compose.yml
        run: docker compose config --quiet    # fails if the YAML is broken

      - name: Build images
        run: docker compose build             # builds both images; fails = red X

      - name: Start the stack
        run: docker compose up -d --wait      # start everything and wait until healthy

      - name: Smoke test - dashboard (Nginx)
        run: curl -fsS http://localhost:8080/ | grep -q "Smart Parking"

      - name: Smoke test - storage through the proxy (Apache)
        run: curl -fsS http://localhost:8080/storage/images/ | grep -q "Index of /images"

      - name: Smoke test - the image has no photos baked in (volume starts empty)
        run: |
          COUNT=$(docker compose exec -T storage sh -c 'ls /usr/local/apache2/htdocs/images | wc -l')
          test "$COUNT" -eq 0

      - name: Smoke test - add a car into the volume
        run: |
          sh scripts/add-car.sh camera/samples/316-52-840.png
          FILE=$(curl -fsS http://localhost:8080/storage/images/ | grep -o '316-52-840_[0-9-]*\.png' | head -1)
          test -n "$FILE"
          curl -fsS -o /dev/null -w "%{content_type}\n" "http://localhost:8080/storage/images/$FILE" | grep -q "image/png"

      - name: Smoke test - add a second car
        run: |
          sh scripts/add-car.sh camera/samples/482-17-305.png
          curl -fsS http://localhost:8080/storage/images/ | grep -q '482-17-305_'

      - name: Smoke test - photos survive "docker compose down" (persistence)
        run: |
          docker compose down
          docker compose up -d --wait
          curl -fsS http://localhost:8080/storage/images/ | grep -q '316-52-840_'
          curl -fsS http://localhost:8080/storage/images/ | grep -q '482-17-305_'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # Job 2 (bonus): push the images to GitHub Container Registry - only from main,
  # and only after Job 1 passed
  push-to-ghcr:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [web, storage]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Lowercase owner name (GHCR requires lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatic token - no password in the code

      - name: Build and push parking-${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/parking-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/parking-${{ matrix.service }}:${{ github.sha }}
